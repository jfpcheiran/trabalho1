####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################
version: "1.0"
linter: qodana-jvm-community
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
  - name: JvmLinesOfCodeInspection
  - name: CyclomaticComplexityInspection
  - name: TestCaseWithConstructor
  - name: TestOnlyProblems
  - name: TestMethodWithoutAssertion
  - name: TestInProductSource
  - name: TestCaseWithNoTestMethods
  - name: Junit4RunWithInspection
  - name: AssertEqualsCalledOnArray
  - name: AssertEqualsMayBeAssertSame
  - name: ExpectedExceptionNeverThrown
  - name: TodoComment
  - name: RedundantSuppression
  - name: ReassignedToPlainText
  - name: ProblematicWhitespace
  - name: LongLine
  - name: QodanaJavaSanity
  - name: JavaAnnotator
  - name: IncorrectFormatting
  - name: InconsistentLineSeparators
  - name: Annotator
  - name: BoundFieldAssignment
  - name: OneButtonGroup
  - name: DuplicateMnemonic
  - name: I18nForm
  - name: InvalidPropertyKeyForm
  - name: MissingMnemonic
  - name: NoLabelFor
  - name: NoButtonGroup
  - name: NoScrollPane
  - name: FormSpellChecking
  - name: AutoCloseableResource
  - name: StringConcatenationInLoops
  - name: ConstantConditions
  - name: NullPointerException
  - name: UnusedDeclaration
  - name: DeprecatedIsStillUsed
